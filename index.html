<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 20px;
            color: #ccc;
        }

        button {
            padding: 12px 24px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>This is my website.</p>
        <button onclick="alert('Hello!')">Click me</button>
    </div>
</body>
</html>
